name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build and publish ARM64 release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Agent Meter v__VERSION__
          releaseBody: |
            Agent Meter v0.4.0 新增 DSH 与 EvoX 指标适配，并检测 Claude Desktop 的本地数据能力。仪表盘现在使用顶层来源标签，当前来源同时控制菜单栏指标。

            仪表盘和设置已改为标准 macOS 窗口：打开时进入 Dock 和 ⌘Tab，最后一个窗口关闭后继续在菜单栏后台运行。设置可从托盘、主窗口或 ⌘, 打开。

            四个菜单栏指标保持独立固定宽度，并改为更清晰的“大数值在上、指标名在下”布局。

            数据源保持本地只读，不上传会话数据。“费”是按版本化官方标准文本 API 单价计算的 USD 等价费用，不代表订阅套餐或实际账单；未知价格会显示覆盖率，不按零处理。

            本版本提供 Apple Silicon DMG 和应用内更新包。DMG 尚未经过 Apple Developer ID 签名或 Apple 公证。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target aarch64-apple-darwin
      - name: Upload DMG checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          shasum -a 256 *.dmg | sed 's/  Agent Meter/  Agent.Meter/' > "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          cd "$GITHUB_WORKSPACE"
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
