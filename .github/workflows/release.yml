name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build and publish ARM64 release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Agent Meter v__VERSION__
          releaseBody: |
            Agent Meter v0.4.2 重构统计口径：Codex 现在按唯一模型响应计数，运行中任务产生的 Token 会及时进入统计；调用用量与 TPS/TTFT 性能样本分离，并增加原始数据、索引数据、未读增量和解析错误的对账状态。

            新增价格管理页，可查看所有历史使用模型，创建、编辑、删除和保留按生效日期区分的价格版本；价格变更后会立即重算历史费用。新增 GPT-6 Astra 标准价格，并保留 Spark 1.3 contributor/free 价格。

            同步流程优先处理活跃文件的未读增量，每个文件完成后立即物化并刷新，跨活动目录与归档目录继续按 response_id 去重。菜单栏保持紧凑两行布局，应用图标默认隐藏。

            数据源保持本地只读，不上传会话数据。“费”是按版本化官方标准文本 API 单价计算的 USD 等价费用，不代表订阅套餐或实际账单；未知价格会显示覆盖率，不按零处理。

            本版本提供 Apple Silicon DMG 和应用内更新包。DMG 尚未经过 Apple Developer ID 签名或 Apple 公证。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target aarch64-apple-darwin
      - name: Verify macOS bundle signature
        run: |
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Agent Meter.app"
          DMG_PATH="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          MOUNT_DIR="$(mktemp -d)/mount"
          mkdir "$MOUNT_DIR"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT_DIR"
          trap 'hdiutil detach "$MOUNT_DIR"' EXIT
          codesign --verify --deep --strict --verbose=2 "$MOUNT_DIR/Agent Meter.app"
      - name: Upload DMG checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          shasum -a 256 *.dmg | sed 's/  Agent Meter/  Agent.Meter/' > "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          cd "$GITHUB_WORKSPACE"
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
